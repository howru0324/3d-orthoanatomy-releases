name: Publish test 0.4.2-beta.3
on:
  push:
    branches: [publish/test-0.4.2-beta.3]
    paths: [.github/workflows/publish-test-0.4.2-beta.3.yml]
permissions:
  contents: write
concurrency:
  group: publish-test-0.4.2-beta.3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: howru0324/3d-orthoanatomy-releases
    steps:
      - name: Verify draft asset sizes and SHA256
        run: |
          $raw = gh api "repos/howru0324/3d-orthoanatomy-releases/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releases = $raw | ConvertFrom-Json
          $matching = @($releases | Where-Object tag_name -EQ 'v0.4.2-beta.3')
          if ($matching.Count -ne 1) { throw 'Expected exactly one release' }
          $release = $matching[0]
          if (!$release.draft -or !$release.prerelease -or $release.assets.Count -ne 3) { throw 'Unexpected release state' }
          $expected = @(
            @{name='3D-orthoanatomy-Test-Setup-0.4.2-beta.3.exe';size=368007663;digest='sha256:fbf4e81a02ec0ee40f36541a631dc9899f342af66b72df22382abca70241a3e6'},
            @{name='3D-orthoanatomy-Test-Setup-0.4.2-beta.3.exe.blockmap';size=386139;digest='sha256:9bd75d5c3ddb1e347d7865bb84e160467af9e22afe5d0648e44f5c8820fafc4a'},
            @{name='beta.yml';size=390;digest='sha256:4a5b6168261d44c775c680d43d201bf1ddcca713d5f820cf12916dd030c86753'}
          )
          foreach ($asset in $expected) {
            $actual = @($release.assets | Where-Object name -EQ $asset.name)
            if ($actual.Count -ne 1 -or $actual[0].size -ne $asset.size -or $actual[0].digest -ne $asset.digest) { throw "Uploaded asset mismatch: $($asset.name)" }
          }
          Write-Host "PASS: all three uploaded assets match verified installer bundle"
      - name: Publish verified beta release
        run: |
          gh release edit v0.4.2-beta.3 --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view v0.4.2-beta.3 --json url,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
